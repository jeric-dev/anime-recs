<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeric's Anime Recommendations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Darumadrop+One&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20260702j">
</head>
<body>
  <header class="hero">
    <div class="hero-collage" id="hero-collage"></div>
    <div class="hero-scrim"></div>
    <div class="hero-content">
      <h1>Jeric's Anime Recommendations</h1>
      <p class="hero-subtitle">Pick what you're in the mood for — mix and match filters to find something from my list.</p>
    </div>
  </header>

  <section class="filter-section">
    <div class="filter-section-inner">
      <div class="filter-controls-bar">
        <button id="filters-toggle" class="filters-toggle-btn" aria-expanded="false">
          <svg class="filters-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="16" height="16">
            <path d="M3 5h18M6 12h12M10 19h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          Filters
          <span class="filters-chevron">▾</span>
        </button>
        <span class="filter-count" id="filter-count"></span>
      </div>
      <div class="filter-actions">
        <button id="clear-filters" class="clear-btn">Clear all</button>
        <label class="toggle-18-label hidden" id="or-mode-label">
          <input type="checkbox" id="toggle-or-mode" autocomplete="off">
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          Match Any (OR)
        </label>
        <label class="toggle-18-label">
          <input type="checkbox" id="toggle-18plus" autocomplete="off">
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          Mature Content
        </label>
        <label class="toggle-18-label">
          <input type="checkbox" id="toggle-show-all" autocomplete="off">
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          Show All Anime
        </label>
      </div>
      <div id="filter-panel" class="collapsed"></div>
    </div>
  </section>

  <main>
    <div id="status-bar" class="status-bar hidden"></div>
    <div id="results" class="results-grid"></div>
  </main>

  <script src="app.js?v=20260707a"></script>
</body>
</html>
